[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-backend"
version = "0.1.0"
description = "Forge — AI-native fitness social platform (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic[email]>=2.7",  # [email] -> email-validator, required by EmailStr in schemas/auth.py
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",  # local BGE-M3 embeddings (docs/04 §3)
    "python-doctr[torch]>=0.8",  # local nutrition-label OCR (docs/05 §3.1); pulls torch+torchvision
    "redis>=5.0",
    "celery>=5.4",
    "anthropic>=0.39",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "boto3>=1.34",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "tenacity>=8.3",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers>=4.5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
