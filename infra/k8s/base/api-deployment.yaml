# API/BFF deployment (docs/12 §3). Overlays patch replicas/resources per env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-api
  labels: { app: forge-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: forge-api }
  template:
    metadata:
      labels: { app: forge-api }
    spec:
      containers:
        - name: api
          image: <ECR>/forge-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: forge-secrets }    # via External Secrets Operator
            - configMapRef: { name: forge-config }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: forge-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: forge-api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: v1
kind: Service
metadata: { name: forge-api }
spec:
  selector: { app: forge-api }
  ports: [{ port: 80, targetPort: 8000 }]
