# Forge — full local stack (backend + frontend) in one file.
#
# Postgres AND Redis run on the HOST (not here) — these containers use host networking so
# `localhost` reaches the host's Postgres (5432) and Redis (6379). The frontend is host-
# networked too so Vite's `/api` proxy can reach the host-bound API on :8000.
#
# Prereqs on the host: PostgreSQL (with pgvector + the `forge` role/db) and Redis running,
# and the DB schema applied (`cd backend && ../env/bin/alembic upgrade head`).
#
# Run everything:   docker compose up --build
#   API   -> http://localhost:8000     Web -> http://localhost:5173
#   MinIO -> http://localhost:9001 (console)
name: forge

services:
  api:
    build: ./backend
    image: forge-backend:local        # built once here; worker/beat reuse this tag
    network_mode: host                 # localhost == host loopback; uvicorn binds host :8000
    env_file: [./backend/.env]
    environment: { HF_HOME: /home/forge/.cache/huggingface }  # persist BGE-M3 weights
    volumes: ["./backend/app:/app/app", "hfcache:/home/forge/.cache/huggingface"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    image: forge-backend:local
    network_mode: host
    env_file: [./backend/.env]
    environment: { HF_HOME: /home/forge/.cache/huggingface }
    volumes: ["hfcache:/home/forge/.cache/huggingface"]
    depends_on: [api]
    command: celery -A app.workers.celery_app worker --loglevel=info

  beat:
    image: forge-backend:local
    network_mode: host
    env_file: [./backend/.env]
    depends_on: [api]
    command: celery -A app.workers.celery_app beat --loglevel=info

  web:
    build: ./frontend
    network_mode: host                 # Vite on :5173, proxies /api -> localhost:8000 (host API)
    depends_on: [api]
    volumes:
      - ./frontend:/app                # live source for HMR
      - web_node_modules:/app/node_modules  # keep the image's arch-correct node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  # Local stand-ins for prod (docs/12): Redpanda ~ Kafka, MinIO ~ S3, Qdrant for vectors.
  redpanda:
    image: redpandadata/redpanda:latest
    command: redpanda start --overprovisioned --smp 1 --memory 512M --node-id 0 --check=false
    ports: ["9092:9092"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: forge, MINIO_ROOT_PASSWORD: forgeforge }
    ports: ["9000:9000", "9001:9001"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]

volumes:
  hfcache:           # cached HuggingFace model weights (BGE-M3)
  web_node_modules:  # frontend deps, built inside the image
